cabecera:
  etiqueta: Sobre nosotros
  titulo: Quiénes somos
  lema: >-
    Divulgación científica en astronomía y más ciencias. Conectando el Universo y
    las Ciencias con la Humanidad.
  datos:
    - etiqueta: Fundación
      valor: '2012'
    - etiqueta: Equipos presenciales
      valor: '3'
intro: >-
  AstroCiencias Ecuador es una iniciativa dedicada a la divulgación científica,
  conformada por un equipo multidisciplinario de personas apasionadas por el
  conocimiento. Compartimos un sueño común: acercar la ciencia a la sociedad,
  inspirar la curiosidad y fomentar el pensamiento crítico en personas de todas
  las edades.
historia:
  titulo: Nuestra historia
  texto: >-
    Fue creada en enero de 2012 por Carlos Silvera, director de AstroCiencias
    Ecuador, compartiendo información astronómica y científica. Su primera
    publicación en Blogger fue el 26 de enero de 2012. El 12 de febrero de 2012
    se creó la página de Facebook de AstroCiencias Ecuador, donde organizamos
    observaciones astronómicas, espacios de charlas, exposiciones y entrevistas
    con invitados de distintas ramas de la ciencia. Desde entonces hemos seguido
    creciendo en otras redes sociales: YouTube, Instagram, X (Twitter) y,
    últimamente, TikTok. Además, contamos con una radio virtual en la plataforma
    Zeno, donde compartimos el audio de nuestras charlas con música variada. Todo
    esto con el propósito de divulgar la ciencia con un enfoque digital,
    utilizando la tecnología y la comunicación actual.
mision:
  titulo: Nuestra misión
  texto: >-
    Promover el interés por la ciencia mediante una divulgación accesible, clara
    y entretenida. Utilizamos un lenguaje sencillo y explicativo para que
    conceptos complejos se vuelvan comprensibles y atractivos para todo público.
enfoque:
  titulo: Nuestro enfoque
  texto: >-
    Creemos que la ciencia no debe quedarse en los laboratorios ni en los libros
    académicos. Por eso, desarrollamos contenidos que conectan con la realidad
    cotidiana, despertando preguntas y motivando el aprendizaje constante.
presencia:
  titulo: Presencia a nivel nacional
  intro: >-
    AstroCiencias Ecuador tiene muchos integrantes unidos por los medios
    digitales, no solo de Ecuador sino también de otros países. A raíz del
    aumento de integrantes en algunas ciudades, en 2022, por iniciativa de la
    ingeniera Alexandra Naranjo, subdirectora de AstroCiencias Ecuador, se
    decidió crear varios equipos para actividades presenciales.
  equipos:
    - nombre: Quito
      estado: activo
    - nombre: Cuenca
      estado: activo
    - nombre: Guayaquil
      estado: activo
    - nombre: Sierra centro
      detalle: Latacunga, Ambato y Riobamba
      estado: planificacion
queHacemos:
  titulo: Qué hacemos
  actividades:
    - Participamos como invitados en escuelas, universidades e instituciones.
    - Organizamos visitas a escuelas para compartir nuestros conocimientos astronómicos y científicos.
    - Organizamos campamentos astronómicos en distintos lugares de Ecuador.
    - Publicamos la revista trimestral de divulgación científica Astro&Ciencias.
    - Editamos cada año un calendario astronómico con las mejores fotografías de nuestro concurso anual de astrofotografía.
    - Publicamos nuestro libro anual de efemérides astronómicas.
  cierre: >-
    Con el fin de promover la divulgación científica para Ecuador e
    Hispanoamérica, en todas nuestras publicaciones colaboran nuestros
    integrantes.
equipo:
  titulo: Liderazgo y coordinación
  personas:
    - nombre: Carlos Silvera
      cargo: Fundador y director
    - nombre: Ing. Alexandra Naranjo
      cargo: Subdirectora
llamada:
  titulo: ¿Te gustaría ser parte de nuestra comunidad?
  botonPrincipal:
    texto: Únete como voluntario
    enlace: /colabora
  botonSecundario:
    texto: Ver próximas actividades
    enlace: /eventos
