titulo: Divulgamos ciencia desde 2012
entradilla: >-
  AstroCiencias Ecuador es una asociación de divulgación científica: astronomía
  y muchas otras ciencias, desde 2012.
historia: >-
  AstroCiencias Ecuador nació en enero de 2012. La fundó Carlos Silvera, su
  director. La primera entrada del blog se publicó el 26 de enero de 2012, y la
  página de Facebook se creó el 12 de febrero de ese mismo año.


  En 2022, la subdirectora, la ingeniera Alexandra Naranjo, propuso crear
  equipos para hacer actividades presenciales en varias ciudades de Ecuador.
mision: >-
  Queremos despertar el interés por la ciencia con una divulgación accesible,
  clara y entretenida. Usamos un lenguaje sencillo para que las ideas complejas
  se entiendan sin ser especialista.


  Nuestro propósito es «acercar la ciencia a la sociedad, inspirar la curiosidad
  y fomentar el pensamiento crítico».
cita: Creemos que la ciencia no debe quedarse en los laboratorios ni en los libros académicos.
queHacemos:
  - Contenido de divulgación en redes sociales.
  - Charlas en directo, entrevistas y observaciones del cielo con invitados de muchas ciencias.
  - AstroCiencias Radio.
  - Visitas a escuelas y universidades.
  - Campamentos de astronomía.
  - La revista trimestral Astro&Ciencias.
  - Un calendario astronómico anual con las fotos ganadoras de un concurso de astrofotografía.
  - Un libro anual de efemérides astronómicas.
dondeEstamos: >-
  Tenemos equipos presenciales en Quito, Cuenca y Guayaquil. Hemos propuesto
  crear otro en la Sierra centro, para Latacunga, Ambato y Riobamba.


  También hay miembros de ACE en otros países.
contacto: Escríbenos por correo o por WhatsApp.
